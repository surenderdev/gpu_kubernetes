name: Openmodel  microservice workflow
on:
 pull_request:
   types:
     - closed
#  push:
#    branches:
#      - Staging
#      - dev
 workflow_call:
   inputs:
      AZURE_CONTAINER_REGISTRY:
        required: true
        type: string
      RESOURCE_GROUP:
        required: true
        type: string
      CLUSTER_NAME:
        required: true
        type: string
      CHART_PATH:
        required: true
        type: string
      branch:
        required: true
        type: string

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  AZURE_CONTAINER_REGISTRY: ${{ inputs.AZURE_CONTAINER_REGISTRY }}
  CONTAINER_NAME: "openmodel-llama3-1-repo"
  RESOURCE_GROUP: ${{ inputs.RESOURCE_GROUP }}
  CLUSTER_NAME: ${{ inputs.CLUSTER_NAME }}
  CHART_PATH: "./helm-openmodel"
##  CHART_OVERRIDE_PATH: "your-chart-override-path"

jobs:
  if_workflow_dispatch:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
    - run: |
       echo "This is aworkflow dispatch"

  buildImage:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    needs: [if_workflow_dispatch]
    steps:
      # Checks out the repository this file is in
      - uses: actions/checkout@v3

      # Logs in with your Azure credentials
      - name: Azure login
        run: |
          az login --service-principal \
            --username ${{ secrets.AZURE_CLIENT_ID }} \
            --password ${{ secrets.AZURE_CLIENT_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}
        
      ####### Builds and pushes an image up to your Azure Container Registry
      - name: Build and push image to ACR
        run: |
          az acr build \
          --image openmodel-llama3-1-repo:${{ github.sha }} --registry ${{ env.AZURE_CONTAINER_REGISTRY }} -g ${{ env.RESOURCE_GROUP }} -f ./Dockerfile .
          
  deploy:
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    needs: [buildImage]
    steps:
      # Checks out the repository this file is in
      - uses: actions/checkout@v3

      # Logs in with your Azure credentials
      - name: Azure login
        run: |
          az login --service-principal \
            --username ${{ secrets.AZURE_CLIENT_ID }} \
            --password ${{ secrets.AZURE_CLIENT_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}

      # Use kubelogin to configure your kubeconfig for Azure auth
      - name: Set up kubelogin for non-interactive login
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.0.25'

      # Retrieves your Azure Kubernetes Service cluster's kubeconfig file
      - name: Get K8s context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}
          admin: 'false'
          use-kubelogin: 'true'

# # ------------------ DEV DEPLOYMENT START ------------------

      # Runs Helm to create manifest files on Staging environment
      - name: Bake deployment
        uses: azure/k8s-bake@v2
        with:
          renderEngine: "helm"
          helmChart: ${{ env.CHART_PATH }}
          overrideFiles: ${{ env.CHART_PATH }}/devValues.yaml
          helm-version: "latest"
          namespace: "dev"
        id: bakedev

      # Deploys application based on manifest files from previous step on Dev
      - name: Deploy application
        uses: Azure/k8s-deploy@v4
        with:
          action: deploy
          namespace: "dev"
          manifests: ${{ steps.bakedev.outputs.manifestsBundle }}
          images: |
            ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ github.sha }}

# # ------------------ DEV DEPLOYMENT END ------------------
      - name: Deploy application
        uses: Azure/k8s-deploy@v4
        with:
          action: deploy
          namespace: dev
          manifests: ${{ steps.bakedev.outputs.manifestsBundle }}
          images: |
            ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ github.sha }}
          timeout: 60m
